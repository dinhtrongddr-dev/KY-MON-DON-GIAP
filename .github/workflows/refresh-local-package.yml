name: Refresh Local Package

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/refresh-local-package.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Windows runtime
        run: npm run prepare:windows
      - name: Rebuild local package
        run: python scripts/package-local.py
      - name: Verify rebuilt package
        run: python scripts/package-local.py --check
      - name: Commit refreshed package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/downloads/ky-mon-ai.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Package already current"
            exit 0
          }
          git commit -m "chore: refresh local package for reasoning upgrade"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:develop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
