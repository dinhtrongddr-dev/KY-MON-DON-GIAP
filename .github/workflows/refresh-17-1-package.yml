name: Refresh v17.1 Windows Package Once

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/refresh-17-1-package.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:launcher
      - name: Refresh launcher pins
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          built=Path('.verification/launcher/KyMonTray.exe')
          target=Path('KyMonTray.exe')
          target.write_bytes(built.read_bytes())
          path=Path('scripts/windows-dependencies.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          source=Path(data['launcher']['source']).read_bytes().replace(b'\r\n',b'\n')
          binary=target.read_bytes()
          data['launcher']['sourceSha256']=hashlib.sha256(source).hexdigest()
          data['launcher']['sha256']=hashlib.sha256(binary).hexdigest()
          data['launcher']['size']=len(binary)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - run: npm run prepare:windows
      - run: python scripts/package-local.py
      - run: npm run check
      - name: Commit refreshed distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KyMonTray.exe scripts/windows-dependencies.json dist/downloads/ky-mon-ai.zip
          if git diff --cached --quiet; then
            echo "Distribution already current"
            exit 0
          fi
          git commit -m "chore: rebuild v17.1 Windows distribution"
          git push origin HEAD:develop
