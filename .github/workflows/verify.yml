name: Verify Frozen Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Verify Windows distribution
        if: matrix.os == 'windows-latest' && matrix.node == 24
        run: |
          npm run prepare:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-local.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
