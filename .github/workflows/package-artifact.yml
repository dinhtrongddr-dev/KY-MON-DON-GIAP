name: Refresh Local Package

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/package-artifact.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare pinned Windows dependency
        run: npm run prepare:windows
      - name: Rebuild deterministic local package
        run: python scripts/package-local.py
      - name: Verify rebuilt package
        run: python scripts/package-local.py --check
      - name: Commit refreshed package to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/downloads/ky-mon-ai.zip
          if git diff --cached --quiet; then
            echo "Package already current."
          else
            git commit -m "chore: refresh local package for named tunnel"
            git push origin HEAD:develop
          fi
