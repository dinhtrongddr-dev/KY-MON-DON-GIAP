name: Refresh Windows Package Once

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/refresh-windows-package.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:windows
      - run: python scripts/package-local.py
      - run: python scripts/package-local.py --check
      - name: Commit refreshed package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/downloads/ky-mon-ai.zip
          if (git diff --cached --quiet) {
            Write-Host "Package already current."
            exit 0
          }
          git commit -m "chore: refresh local package after semantic routing changes"
          git push origin HEAD:develop
