name: Refresh Audit Package Once

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/refresh-audit-package.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:windows
      - run: python scripts/package-local.py
      - name: Commit refreshed distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/downloads/ky-mon-ai.zip
          if git diff --cached --quiet; then
            echo "Package already current"
            exit 0
          fi
          git commit -m "chore: refresh Windows package for audit update"
          git push origin HEAD:develop
