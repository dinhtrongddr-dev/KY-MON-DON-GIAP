name: Deploy Ky Mon Worker Once

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/deploy-worker-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production relay Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config relay/wrangler.jsonc
